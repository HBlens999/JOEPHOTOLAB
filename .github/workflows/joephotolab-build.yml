name: JoePhotoLab Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - functional-audit-render-tools-20261008

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: npm run build
